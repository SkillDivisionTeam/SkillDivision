name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

env:
  PYTHON_VERSION: '3.11'
  DJANGO_SETTINGS_MODULE: skill_division.settings

jobs:
  lint:
    name: Линтинг и проверка типов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Кеширование pip-зависимостей
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r backend/requirements.txt

      - name: Запуск Ruff (линтинг)
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Запуск MyPy (проверка типов)
        run: mypy backend/ --ignore-missing-imports

  test:
    name: Запуск тестов
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:14.12-alpine
        env:
          POSTGRES_DB: skilldivision
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: test-secret-key
      POSTGRES_DB: skilldivision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Применение миграций
        run: |
          cd backend
          python manage.py migrate

      - name: Запуск тестов с покрытием
        run: |
          cd backend
          pytest --cov=api --cov-report=xml --cov-report=term-missing || (echo "No tests found or tests failed" && exit 0)

      - name: Загрузка отчёта о покрытии в Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  build:
    name: Сборка и валидация Docker-образа
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Сборка Docker-образа
        run: docker build -t skilldivision-backend:${{ github.sha }} ./backend

      - name: Проверка запуска контейнера
        run: |
          docker run --rm skilldivision-backend:${{ github.sha }} python manage.py check
