name: Bot CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'bot/**'
      - '.github/workflows/bot.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'bot/**'
      - '.github/workflows/bot.yml'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Линтинг и проверка типов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Кеширование pip-зависимостей
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-bot-pip-${{ hashFiles('bot/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-bot-pip-

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r bot/requirements.txt

      - name: Запуск Ruff (линтинг)
        run: |
          ruff check bot/
          ruff format --check bot/

      - name: Запуск MyPy (проверка типов)
        run: mypy bot/ --ignore-missing-imports

  test:
    name: Запуск тестов
    runs-on: ubuntu-latest
    needs: lint
    env:
      TG_TOKEN: dummy-token-for-tests
      GIGACHAT_TOKEN: dummy-gigachat-token
      BACKEND_API_URL: http://localhost:8000/api

    steps:
      - uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Запуск тестов с покрытием
        run: |
          cd bot
          # --co: только сбор тестов без запуска; если 0 тестов — тихий exit 0
          # Если тесты есть и падают — pytest вернёт ненулевой код и CI упадёт
          TEST_COUNT=$(pytest --co -q 2>/dev/null | tail -1 | grep -oP '^\d+' || echo 0)
          if [ "$TEST_COUNT" = "0" ]; then
            echo "No bot tests found — skipping coverage"
          else
            pytest --cov=. --cov-report=xml --cov-report=term-missing
          fi

      - name: Загрузка отчёта о покрытии в Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./bot/coverage.xml
          flags: bot
          name: bot-coverage
          fail_ci_if_error: false

  build:
    name: Сборка Docker-образа
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Сборка Docker-образа
        run: docker build -t skilldivision-bot:${{ github.sha }} ./bot

      - name: Проверка синтаксиса контейнера
        run: |
          docker run --rm skilldivision-bot:${{ github.sha }} python -c "import telebot; print('Bot imports OK')"
