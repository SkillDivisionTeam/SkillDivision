name: Infrastructure CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'docker-compose*.yml'
      - 'nginx/**'
      - 'backend/Dockerfile*'
      - 'frontend/Dockerfile*'
      - 'bot/Dockerfile*'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docker-compose*.yml'
      - 'nginx/**'
      - 'backend/Dockerfile*'
      - 'frontend/Dockerfile*'
      - 'bot/Dockerfile*'
      - '.github/workflows/infra.yml'

jobs:
  validate:
    name: Валидация конфигураций
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Создание .env для CI
        run: |
          cat > .env << 'EOF'
          POSTGRES_DB=skilldivision
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci-test-password
          DJANGO_SECRET_KEY=ci-test-secret-key-not-for-production
          DJANGO_DEBUG=False
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
          CORS_ALLOWED_ORIGINS=http://localhost
          TG_TOKEN=dummy-token
          GIGACHAT_TOKEN=dummy-gigachat
          GEMINI_API_KEY=dummy-gemini
          VITE_API_URL=/api
          BACKEND_API_URL=http://backend:8000/api
          PGADMIN_DEFAULT_EMAIL=admin@admin.com
          PGADMIN_DEFAULT_PASSWORD=ci-admin
          EOF

      - name: Проверка docker-compose.yml (dev)
        run: docker compose -f docker-compose.yml config -q

      - name: Проверка docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml config -q

      - name: Проверка синтаксиса nginx.conf
        run: docker run --rm -v ${{ github.workspace }}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro nginx:1.25-alpine nginx -t

  build-images:
    name: Сборка Docker-образов
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа Backend (dev)
        run: docker build -t skilldivision-backend:ci ./backend

      - name: Проверка backend (manage.py check)
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY=ci-test-key \
            -e DJANGO_DEBUG=True \
            -e POSTGRES_DB=skilldivision \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_HOST=localhost \
            skilldivision-backend:ci \
            python manage.py check

      - name: Сборка образа Backend (prod / Gunicorn)
        run: docker build -t skilldivision-backend-prod:ci -f backend/Dockerfile.prod ./backend

      - name: Сборка образа Bot
        run: docker build -t skilldivision-bot:ci ./bot

      - name: Проверка импортов бота
        run: |
          docker run --rm \
            -e TG_TOKEN=dummy \
            -e GIGACHAT_TOKEN=dummy \
            -e BACKEND_API_URL=http://localhost:8000/api \
            skilldivision-bot:ci \
            python -c "import bot; print('Bot imports OK')"

      - name: Сборка образа Frontend (prod)
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            -t skilldivision-frontend-prod:ci \
            -f frontend/Dockerfile.prod \
            ./frontend
