# Production: Nginx, Gunicorn, без hot reload, БД только во внутренней сети
services:
  nginx:
    image: nginx:1.25-alpine
    container_name: skill_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - frontend_net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: skill_backend_prod
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: skill_frontend_prod
    expose:
      - "80"
    networks:
      - frontend_net
    restart: unless-stopped

  bot:
    build: ./bot
    container_name: skill_bot_prod
    env_file:
      - .env
    environment:
      BACKEND_API_URL: http://backend:8000/api
    depends_on:
      backend:
        condition: service_healthy
    # frontend_net: доступ к backend и исходящий интернет (Telegram API)
    networks:
      - frontend_net
    restart: unless-stopped

  db:
    image: postgres:14.12-alpine
    container_name: skill_db_prod
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skilldivision}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skilldivision}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend_net

volumes:
  postgres_data:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true
